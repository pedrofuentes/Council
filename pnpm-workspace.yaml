packages:
  - "packages/*"

# Moved from the package.json "pnpm" field, which pnpm 10 no longer reads.
# These are security/version pins for transitive dependencies; keep them in sync
# with any advisory remediation.
overrides:
  "brace-expansion@>=5": "5.0.6"
  "ws@>=8": "8.21.0"
  "uuid@<11.1.1": ">=11.1.1"
  "js-yaml@<4.2.0": ">=4.2.0 <5"
  "esbuild@<0.28.1": ">=0.28.1"
  "yaml@<2.8.3": ">=2.8.3"

# pnpm 10 does not run dependency build scripts unless explicitly allow-listed.
# esbuild (build/tsup) and sharp (packages/site image processing) need their builds.
#
# SECURITY CONTROL: this allow-list IS the CI trusted-lifecycle-script allowlist. Under
# `pnpm install --frozen-lockfile` (every CI job), ONLY the packages listed here may run
# build/postinstall scripts; every other dependency's scripts are blocked by default, so a
# blanket `--ignore-scripts` is intentionally NOT used (it would also break these two native
# builds). See DECISIONS.md ADR-032 (#1323). Additions require a deliberate trust decision.
onlyBuiltDependencies:
  - esbuild
  - sharp

# pnpm 11 removed onlyBuiltDependencies (merged into the allowBuilds map). Keep both
# keys so installs are clean on pnpm 10 (CI / packageManager pin) AND pnpm 11+.
# See https://pnpm.io/migration. Drop onlyBuiltDependencies once the repo is on pnpm 11.
allowBuilds:
  esbuild: true
  sharp: true
