name: Dependency Audit

# Software Composition Analysis (SCA) gate. Fails the build when a new
# high- or critical-severity advisory is reported against the dependency
# graph. Advisories are remediated via the `overrides:` pins in
# pnpm-workspace.yaml; this gate ensures a newly-disclosed one is caught
# before it lands on main.
on:
  pull_request:
    branches: [main]
    # Re-audit whenever the dependency graph could change.
    paths:
      - "package.json"
      - "packages/**/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/audit.yml"
  schedule:
    # Weekly on Sundays at 00:00 UTC — catches advisories disclosed against
    # the existing dependency graph even without a dependency change.
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (high & critical)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full-graph audit (production + dev). Gating at `high` blocks the build
      # on high/critical advisories while tolerating pre-existing low/moderate
      # noise, so the gate stays green until a genuinely serious advisory
      # appears. `--prod` scoping is intentionally NOT used: build/test tooling
      # ships in CI and dev machines too, so high/critical advisories there
      # must still fail the gate.
      - name: Audit dependencies (fail on high/critical advisories)
        run: pnpm audit --audit-level=high
