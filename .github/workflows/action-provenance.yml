name: Action Pin Provenance

# Supply-chain gate: prove every pinned GitHub Action SHA in
# .github/workflows/*.yml matches its commented `# vX.Y.Z` release tag.
# Dependabot (github-actions ecosystem, see .github/dependabot.yml) keeps the
# SHAs current; this workflow proves the SHA and its human-readable comment
# never drift apart. Runs on workflow/script changes, on demand, and weekly to
# catch a tag that is force-moved after a pin lands.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/verify-action-pins.mjs"
  workflow_dispatch:
  schedule:
    # Weekly on Mondays at 08:00 UTC.
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  verify-pins:
    name: Verify action SHA pins
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Verify pinned action SHAs match their release tags
        env:
          # Read-only token; the verifier only calls the GitHub git refs/tags API.
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-action-pins.mjs
