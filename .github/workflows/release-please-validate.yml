name: Validate Release-Please Config

# PR-time guard for release-please v5 (#623). The Release workflow
# (release-please.yml) only runs post-merge on `main`, so a
# release-please-config.json / .release-please-manifest.json that
# release-please-action v5 (core v17) rejects would otherwise only fail after
# it has landed. This validates the config/manifest whenever a PR touches them.
on:
  pull_request:
    paths:
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - "scripts/validate-release-please-config.mjs"
      - ".github/workflows/release-please-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-config:
    name: Validate release-please v5 config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # Dependency-free: the validator uses only Node.js built-ins, so no
      # pnpm install / third-party action is required.
      - name: Validate release-please config & manifest
        run: node scripts/validate-release-please-config.mjs
