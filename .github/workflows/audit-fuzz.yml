name: Fuzz Dependency Audit

# Software Composition Analysis (SCA) gate for the standalone
# .clusterfuzzlite/jazzer/ npm project. That project pins the ClusterFuzzLite
# fuzz engine (@jazzer.js/core) via its own package.json + package-lock.json and
# is NOT part of the pnpm workspace, so the workspace audit gate (audit.yml,
# which only triggers on package.json / packages/**/package.json / pnpm-lock.yaml
# / pnpm-workspace.yaml and runs `pnpm audit`) never scans it. Without this gate
# a newly-disclosed high/critical advisory against the jazzer dependency graph
# — e.g. a regression of the tar remediation from PR #2374 — would land on main
# undetected. This job fails the build when such an advisory appears.
on:
  pull_request:
    branches: [main]
    # Re-audit whenever the jazzer dependency graph (or this gate) could change.
    paths:
      - ".clusterfuzzlite/jazzer/package.json"
      - ".clusterfuzzlite/jazzer/package-lock.json"
      - ".github/workflows/audit-fuzz.yml"
  schedule:
    # Weekly on Sundays at 00:00 UTC — catches advisories disclosed against the
    # existing jazzer dependency graph even without a dependency change.
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (high & critical)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # Install from the committed, integrity-verified lockfile. `--ignore-scripts`
      # keeps the audit read-only (no dependency lifecycle scripts execute), and
      # `npm ci` additionally fails if package.json and package-lock.json drift out
      # of sync — mirroring how .clusterfuzzlite/build.sh installs the fuzz engine.
      - name: Install jazzer dependencies (integrity-verified, no scripts)
        run: npm ci --ignore-scripts
        working-directory: .clusterfuzzlite/jazzer

      # Gate at `high` to match the workspace pnpm audit gate: fail the build on
      # high/critical advisories while tolerating pre-existing low/moderate noise.
      - name: Audit jazzer dependencies (fail on high/critical advisories)
        run: npm audit --audit-level=high
        working-directory: .clusterfuzzlite/jazzer
